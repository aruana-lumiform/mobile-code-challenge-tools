name: Deploy challenge site

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deployment finish rather than cancelling it: a half-published
# site would break candidates who are mid-challenge.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  validate:
    name: Validate challenge.json
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - run: python3 scripts/validate.py

  deploy:
    name: Deploy to GitHub Pages
    needs: validate
    # Pages only accepts deployments from the default branch, so skip this job
    # on pull requests and on side branches instead of failing them.
    if: github.event_name != 'pull_request' && github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      # No `enablement: true` here: the default GITHUB_TOKEN cannot create a
      # Pages site ("Resource not accessible by integration"), and the failure it
      # produces hides the real cause. Pages is switched on once by hand instead
      # (see the README); this step then just reads the existing configuration.
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - id: deployment
        uses: actions/deploy-pages@v4
